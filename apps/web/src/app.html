<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <title>Issues</title>
    <script>
      // Apply the saved theme before first paint (avoids a flash).
      try {
        // Carry the pre-rename key over once (ADR 0020).
        const legacy = localStorage.getItem('tracker.theme');
        if (legacy !== null) {
          if (localStorage.getItem('poietic-issues.theme') === null)
            localStorage.setItem('poietic-issues.theme', legacy);
          localStorage.removeItem('tracker.theme');
        }
        const t = localStorage.getItem('poietic-issues.theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
